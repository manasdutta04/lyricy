<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Lyricy">
  <!-- Simplified mark for 16–32 px: two thick lines and the playhead stay crisp. -->
  <defs>
    <linearGradient id="bg" x1="3" y1="1" x2="29" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="0.48" stop-color="#FF2D6F"/>
      <stop offset="1" stop-color="#7A2CF5"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>
  <rect x="6" y="9" width="20" height="5" rx="2.5" fill="#FFFFFF"/>
  <rect x="6" y="18" width="13" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="21.5" cy="11.5" r="3.6" fill="#FFFFFF"/>
</svg>
