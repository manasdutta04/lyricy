<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128" role="img" aria-label="Lyricy">
  <!-- An "L" that turns into a sound wave as it sweeps right: the letter sings. -->
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(30 22) rotate(48) scale(150)">
      <stop offset="0" stop-color="#2A1A2E"/>
      <stop offset="0.6" stop-color="#15101B"/>
      <stop offset="1" stop-color="#0E0B13"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="34" y1="24" x2="108" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC15E"/>
      <stop offset="0.45" stop-color="#FF6A5C"/>
      <stop offset="1" stop-color="#D24BFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>

  <g filter="url(#glow)" opacity="0.55">
    <path d="M38 26 V72 C38 88 47 96 58 96 C70 96 66 64 86 64 C102 64 101 86 108 86"
          fill="none" stroke="url(#ribbon)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M38 26 V72 C38 88 47 96 58 96 C70 96 66 64 86 64 C102 64 101 86 108 86"
        fill="none" stroke="url(#ribbon)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A single bright note above the wave -->
  <circle cx="100" cy="36" r="7" fill="#FFE2B0"/>
</svg>
