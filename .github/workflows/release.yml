name: Release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to publish a
# GitHub release with the ready-to-install zip attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - run: npm run zip

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The "## [x.y.z]" section, up to the next heading or the link references.
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && (/^## / || /^\[[^]]*\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            echo "Download \`lyricy-$version-chrome.zip\` below, unzip it, and load the folder from \`chrome://extensions\` (Developer mode → Load unpacked). Full steps: [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/INSTALL.md)."
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .output/*-chrome.zip \
            --title "Lyricy $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
